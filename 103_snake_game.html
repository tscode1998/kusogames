    <!-- ===== 共通部分: サイトフッター（index.html と同じ）。修正時は全ゲームページを更新 ===== -->
    <!-- ===== /共通部分: サイトフッター ===== -->

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const adModal = document.getElementById('adModal');

        const gridSize = 14; // 280 / 20px per cell = 14x14 grid
        const tileSize = 20;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = tileSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_highscore') || 0;
        let gameInterval = null;
        let isGameOver = false;

        document.getElementById('highScore').innerText = highScore;

        function initGame() {
            snake = [
                { x: 5 * tileSize, y: 7 * tileSize },
                { x: 4 * tileSize, y: 7 * tileSize },
                { x: 3 * tileSize, y: 7 * tileSize }
            ];
            dx = tileSize;
            dy = 0;
            score = 0;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            spawnFood();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * gridSize) * tileSize;
            food.y = Math.floor(Math.random() * gridSize) * tileSize;

            // Don't spawn food inside snake
            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) {
                    spawnFood();
                }
            });
        }

        function gameLoop() {
            if (isGameOver) return;

            // Move Snake Head
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return triggerGameOver();
            }

            // Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return triggerGameOver();
                }
            }

            snake.unshift(head);

            // Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake_highscore', highScore);
                    document.getElementById('highScore').innerText = highScore;
                }
                spawnFood();
            } else {
                snake.pop(); // Remove tail
            }

            draw();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#151515';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.fillStyle = '#ff5252';
            ctx.beginPath();
            ctx.arc(food.x + tileSize / 2, food.y + tileSize / 2, tileSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#8bc34a' : '#689f38'; // Head is brighter
                ctx.fillRect(segment.x + 1, segment.y + 1, tileSize - 2, tileSize - 2);
            });
        }

        function changeDirection(newDx, newDy) {
            if (adModal.style.display === 'flex' || isGameOver) return;
            // Prevent 180 degree reverse
            if (dx === -newDx && dy === -newDy) return;
            if (dx === newDx && dy === newDy) return;
            dx = newDx;
            dy = newDy;
        }

        function triggerGameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff5252';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = '#fff';
            ctx.font = '14px sans-serif';
            ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 15);

            handleGameOver();
        }

        function handleGameOver() {
            setTimeout(() => {
                adModal.style.display = 'flex';
            }, 1000);
        }

        function closeAdModal() {
            adModal.style.display = 'none';
            resetGame();
        }

        function resetGame() {
            if (adModal.style.display === 'flex') return;
            initGame();
        }

        // Controls (Keyboard)
        document.addEventListener('keydown', e => {
            if (adModal.style.display === 'flex') return;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault(); // 矢印キーでページがスクロールしないように
            if (e.key === 'ArrowUp') changeDirection(0, -tileSize);
            else if (e.key === 'ArrowDown') changeDirection(0, tileSize);
            else if (e.key === 'ArrowLeft') changeDirection(-tileSize, 0);
            else if (e.key === 'ArrowRight') changeDirection(tileSize, 0);
        });

        // Controls (Touch Buttons)
        document.getElementById('btn-up').addEventListener('click', () => changeDirection(0, -tileSize));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection(0, tileSize));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection(-tileSize, 0));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection(tileSize, 0));

        // Start
        initGame();
    </script>
</body>
</html>
