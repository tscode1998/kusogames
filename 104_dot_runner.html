<body>

    <!-- ===== 共通部分: サイトヘッダー（contact.html と同じ構成。右のビジュアルだけゲームごとに変更）。修正時は全ゲームページを更新 ===== -->

    <!-- ===== 共通部分: サイトフッター（index.html と同じ）。修正時は全ゲームページを更新 ===== -->
    <!-- ===== /共通部分: サイトフッター ===== -->

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best');
        const adModal = document.getElementById('adModal');

        let player = {
            x: 50,
            y: 200,
            size: 12,
            gravity: 0.35,
            velocity: 0,
            jump: -6.5
        };

        let pipes = [];
        let frameCount = 0;
        let score = 0;
        let best = localStorage.getItem('runner_best') || 0;
        let isGameOver = false;
        let isStarted = false;

        bestDisplay.textContent = best;

        function drawPlayer() {
            ctx.fillStyle = '#f2b179';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f9f6f2';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPipes() {
            ctx.fillStyle = '#eee4da';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
            });
        }

        function updatePipes() {
            if (frameCount % 90 === 0) {
                let gap = 110;
                let minHeight = 40;
                let maxHeight = canvas.height - gap - minHeight;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                let bottomHeight = canvas.height - topHeight - gap;

                pipes.push({
                    x: canvas.width,
                    width: 35,
                    top: topHeight,
                    bottom: bottomHeight,
                    passed: false
                });
            }

            pipes.forEach(pipe => {
                pipe.x -= 2;

                if (!pipe.passed && pipe.x + pipe.width < player.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    if (score > best) {
                        best = score;
                        bestDisplay.textContent = best;
                        localStorage.setItem('runner_best', best);
                    }
                }
            });

            if (pipes.length > 0 && pipes[0].x < -35) {
                pipes.shift();
            }
        }

        function checkCollision() {
            if (player.y + player.size >= canvas.height || player.y - player.size <= 0) {
                return true;
            }

            for (let pipe of pipes) {
                if (player.x + player.size > pipe.x && player.x - player.size < pipe.x + pipe.width) {
                    if (player.y - player.size < pipe.top || player.y + player.size > canvas.height - pipe.bottom) {
                        return true;
                    }
                }
            }
            return false;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isStarted) {
                drawPlayer();
                ctx.fillStyle = '#f9f6f2';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('タップまたはスペースでスタート', canvas.width / 2, canvas.height / 2);
                return;
            }

            if (isGameOver) {
                drawPipes();
                drawPlayer();
                ctx.fillStyle = 'rgba(119, 110, 101, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f9f6f2';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

                ctx.font = '14px sans-serif';
                ctx.fillText('タップで再挑戦', canvas.width / 2, canvas.height / 2 + 25);
                return;
            }

            player.velocity += player.gravity;
            player.y += player.velocity;

            frameCount++;
            updatePipes();

            if (checkCollision()) {
                isGameOver = true;
                handleGameOver();
            }

            drawPipes();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        function doJump() {
            if (adModal.style.display === 'flex') return;

            if (!isStarted) {
                isStarted = true;
                gameLoop();
                return;
            }

            if (isGameOver) {
                resetGame();
                return;
            }

            player.velocity = player.jump;
        }

        function handleGameOver() {
            setTimeout(() => {
                adModal.style.display = 'flex';
            }, 1000);
        }

        function closeAdModal() {
            adModal.style.display = 'none';
            resetGame();
        }

        function resetGame() {
            if (adModal.style.display === 'flex') return;
            player.y = 200;
            player.velocity = 0;
            pipes = [];
            frameCount = 0;
            score = 0;
            scoreDisplay.textContent = 0;
            isGameOver = false;
            isStarted = true;
            gameLoop();
        }

        window.addEventListener('keydown', (e) => {
            if (adModal.style.display === 'flex') return;
            if (e.code === 'Space') {
                e.preventDefault();
                doJump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (adModal.style.display === 'flex') return;
            e.preventDefault();
            doJump();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (adModal.style.display === 'flex') return;
            doJump();
        });

        gameLoop();
    </script>
