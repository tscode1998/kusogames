<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DOT RUNNER | MY WEB LAB</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            margin: 0;
            color: #776e65;
        }
        .scores {
            display: flex;
            gap: 8px;
        }
        .score-box {
            background: #bbada0;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            min-width: 50px;
        }
        .score-box span {
            display: block;
            font-size: 14px;
            margin-top: 2px;
        }
        canvas {
            background-color: #8f7a66;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 320px;
            height: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info {
            font-size: 12px;
            color: #8f7a66;
        }
        button {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:active {
            background: #776e65;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: left; margin-bottom: 8px;">
            <a href="000_gameindex.html" style="text-decoration:none; color:#776e65; font-size:12px;">← ポータルへ戻る</a>
        </div>

        <div class="header">
            <h1>DOT RUNNER</h1>
            <div class="scores">
                <div class="score-box">SCORE<span id="score">0</span></div>
                <div class="score-box">BEST<span id="best">0</span></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="320" height="400"></canvas>

        <div class="controls">
            <div class="info">画面タップ / スペースキーでジャンプ</div>
            <button id="btnRestart" onclick="resetGame()">リセット</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best');

        let player = {
            x: 50,
            y: 200,
            size: 12,
            gravity: 0.35,
            velocity: 0,
            jump: -6.5
        };

        let pipes = [];
        let frameCount = 0;
        let score = 0;
        let best = localStorage.getItem('runner_best') || 0;
        let isGameOver = false;
        let isStarted = false;

        bestDisplay.textContent = best;

        function drawPlayer() {
            ctx.fillStyle = '#f2b179';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f9f6f2';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPipes() {
            ctx.fillStyle = '#eee4da';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
            });
        }

        function updatePipes() {
            if (frameCount % 90 === 0) {
                let gap = 110;
                let minHeight = 40;
                let maxHeight = canvas.height - gap - minHeight;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                let bottomHeight = canvas.height - topHeight - gap;

                pipes.push({
                    x: canvas.width,
                    width: 35,
                    top: topHeight,
                    bottom: bottomHeight,
                    passed: false
                });
            }

            pipes.forEach(pipe => {
                pipe.x -= 2;

                if (!pipe.passed && pipe.x + pipe.width < player.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    if (score > best) {
                        best = score;
                        bestDisplay.textContent = best;
                        localStorage.setItem('runner_best', best);
                    }
                }
            });

            if (pipes.length > 0 && pipes[0].x < -35) {
                pipes.shift();
            }
        }

        function checkCollision() {
            if (player.y + player.size >= canvas.height || player.y - player.size <= 0) {
                return true;
            }

            for (let pipe of pipes) {
                if (player.x + player.size > pipe.x && player.x - player.size < pipe.x + pipe.width) {
                    if (player.y - player.size < pipe.top || player.y + player.size > canvas.height - pipe.bottom) {
                        return true;
                    }
                }
            }
            return false;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isStarted) {
                drawPlayer();
                ctx.fillStyle = '#f9f6f2';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('タップまたはスペースでスタート', canvas.width / 2, canvas.height / 2);
                return;
            }

            if (isGameOver) {
                drawPipes();
                drawPlayer();
                ctx.fillStyle = 'rgba(119, 110, 101, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f9f6f2';
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

                ctx.font = '14px sans-serif';
                ctx.fillText('タップで再挑戦', canvas.width / 2, canvas.height / 2 + 25);
                return;
            }

            player.velocity += player.gravity;
            player.y += player.velocity;

            frameCount++;
            updatePipes();

            if (checkCollision()) {
                isGameOver = true;
            }

            drawPipes();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        function doJump() {
            if (!isStarted) {
                isStarted = true;
                gameLoop();
                return;
            }

            if (isGameOver) {
                resetGame();
                return;
            }

            player.velocity = player.jump;
        }

        function resetGame() {
            player.y = 200;
            player.velocity = 0;
            pipes = [];
            frameCount = 0;
            score = 0;
            scoreDisplay.textContent = 0;
            isGameOver = false;
            isStarted = true;
            gameLoop();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                doJump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            doJump();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            doJump();
        });

        gameLoop();
    </script>
</body>
</html>
