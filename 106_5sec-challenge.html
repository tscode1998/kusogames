    <!-- ===== 共通部分: サイトフッター（index.html と同じ）。修正時は全ゲームページを更新 ===== -->
    <!-- ===== /共通部分: サイトフッター ===== -->

    <script>
        // ==========================================
        // 評価設定・バランス調整用パラメータ
        // ==========================================
        const TARGET_TIME = 5.000; // 目標秒数

        // 誤差（秒）に基づく評価定義
        function getEvaluation(diff) {
            if (diff === 0) {
                return { mark: "💮", rank: "ハナマル！", comment: "奇跡のピッタリ！神業です！" };
            } else if (diff <= 0.100) {
                return { mark: "◎", rank: "二重丸", comment: "すごい！かなりおしい！" };
            } else if (diff <= 0.500) {
                return { mark: "〇", rank: "丸", comment: "ナイス！なかなか良い感覚！" };
            } else if (diff <= 1.000) {
                return { mark: "△", rank: "三角", comment: "惜しい！もう少し！" };
            } else {
                return { mark: "×", rank: "バツ", comment: "残念！再挑戦しよう！" };
            }
        }

        // ==========================================
        // ゲーム変数
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲーム状態: 'READY' (待機中), 'RUNNING' (測定中), 'FINISHED' (結果表示)
        let gameState = 'READY';
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId = null;

        let currentResult = null;

        // UI用カラー定義
        const COLOR_BG = '#8f7a66';
        const COLOR_TEXT_SUB = '#eee4da';
        const COLOR_BTN_START = '#f65e3b';
        const COLOR_BTN_START_ACTIVE = '#e04b28';
        const COLOR_BTN_STOP = '#edc22e';
        const COLOR_BTN_STOP_ACTIVE = '#b89214';

        let isButtonPressed = false;

        // ==========================================
        // 描画処理
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景描画
            ctx.fillStyle = COLOR_BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. ディスプレイ枠描画
            ctx.fillStyle = '#bbada0';
            ctx.beginPath();
            ctx.roundRect(20, 20, 280, 140, 10);
            ctx.fill();

            ctx.fillStyle = '#faf8ef';
            ctx.beginPath();
            ctx.roundRect(28, 28, 264, 124, 6);
            ctx.fill();

            // 2. タイム表示・不透明度の計算（フェードアウト効果）
            let displayStr = "0.000";
            let opacity = 1.0;

            if (gameState === 'READY') {
                displayStr = "0.000";
                opacity = 1.0;
            } else if (gameState === 'RUNNING') {
                displayStr = elapsedTime.toFixed(3);
                if (elapsedTime <= 1.0) {
                    opacity = 1.0;
                } else if (elapsedTime <= 2.0) {
                    // 1秒から2秒にかけて徐々に透明になる (1.0 -> 0.0)
                    opacity = 1.0 - (elapsedTime - 1.0);
                } else {
                    opacity = 0.0;
                }
            } else if (gameState === 'FINISHED') {
                displayStr = elapsedTime.toFixed(3);
                opacity = 1.0;
            }

            // ディスプレイ内のタイムテキスト
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, opacity));
            ctx.fillStyle = '#776e65';
            ctx.font = 'bold 42px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(displayStr + "s", 160, 90);
            ctx.restore();

            // フェードアウト中に隠れていることを示すインジケータ
            if (gameState === 'RUNNING' && opacity < 0.2) {
                ctx.fillStyle = '#bbada0';
                ctx.font = 'bold 16px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("? ? . ? ? ?", 160, 90);
            }

            // 3. メッセージ・評価結果の表示
            if (gameState === 'READY') {
                ctx.fillStyle = COLOR_TEXT_SUB;
                ctx.font = 'bold 16px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("5.000秒を目指してストップ！", 160, 195);
            } else if (gameState === 'RUNNING') {
                ctx.fillStyle = COLOR_TEXT_SUB;
                ctx.font = 'bold 16px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("体内時計で5秒を測ろう！", 160, 195);
            } else if (gameState === 'FINISHED' && currentResult) {
                const diffSign = currentResult.diff >= 0 ? "+" : "";
                const diffStr = `誤差: ${diffSign}${currentResult.diff.toFixed(3)}秒`;

                // 評価マーク (大きなアイコン/文字)
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(currentResult.eval.mark, 160, 185);

                // 評価の解説
                ctx.font = 'bold 15px -apple-system, sans-serif';
                ctx.fillText(currentResult.eval.comment, 160, 220);

                // 誤差詳細
                ctx.fillStyle = COLOR_TEXT_SUB;
                ctx.font = '13px -apple-system, sans-serif';
                ctx.fillText(diffStr, 160, 242);
            }

            // 4. ストップウォッチ操作ボタンの描画
            const btnX = 160;
            const btnY = 320;
            const btnRadius = 50;

            let btnColor = COLOR_BTN_START;
            let btnText = "START";

            if (gameState === 'READY') {
                btnColor = isButtonPressed ? COLOR_BTN_START_ACTIVE : COLOR_BTN_START;
                btnText = "START";
            } else if (gameState === 'RUNNING') {
                btnColor = isButtonPressed ? COLOR_BTN_STOP_ACTIVE : COLOR_BTN_STOP;
                btnText = "STOP";
            } else if (gameState === 'FINISHED') {
                btnColor = '#bbada0';
                btnText = "FINISH";
            }

            // ボタンの影・立体感
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.arc(btnX, btnY + 4, btnRadius, 0, Math.PI * 2);
            ctx.fill();

            // ボタン本体
            ctx.fillStyle = btnColor;
            ctx.beginPath();
            ctx.arc(btnX, btnY, btnRadius, 0, Math.PI * 2);
            ctx.fill();

            // ボタンテキスト
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(btnText, btnX, btnY);
        }

        // ==========================================
        // ゲームループ
        // ==========================================
        function update() {
            if (gameState === 'RUNNING') {
                elapsedTime = (performance.now() - startTime) / 1000;
            }
            draw();
            animationFrameId = requestAnimationFrame(update);
        }

        // ==========================================
        // ゲームコントロール
        // ==========================================
        function handleAction() {
            // モーダル表示中は操作無効
            const adModal = document.getElementById('adModal');
            if (adModal && adModal.style.display === 'flex') {
                return;
            }

            if (gameState === 'READY') {
                // スタート処理
                gameState = 'RUNNING';
                startTime = performance.now();
                elapsedTime = 0;
            } else if (gameState === 'RUNNING') {
                // ストップ処理
                gameState = 'FINISHED';
                elapsedTime = (performance.now() - startTime) / 1000;

                const diff = elapsedTime - TARGET_TIME;
                const absDiff = Math.abs(diff);
                const evaluation = getEvaluation(absDiff);

                currentResult = {
                    time: elapsedTime,
                    diff: diff,
                    eval: evaluation
                };

                // 評価結果をしっかり確認させた後に広告を表示（1.8秒後）
                handleGameOver();
            }
        }

        function resetGame() {
            gameState = 'READY';
            elapsedTime = 0;
            currentResult = null;
            draw();
        }

        function handleGameOver() {
            setTimeout(() => {
                document.getElementById('adModal').style.display = 'flex';
            }, 1000);
        }

        function closeAdModal() {
            document.getElementById('adModal').style.display = 'none';
            resetGame();
        }

        // ==========================================
        // イベントリスナー登録
        // ==========================================
        function triggerButtonEffect() {
            isButtonPressed = true;
            draw();
            setTimeout(() => {
                isButtonPressed = false;
                draw();
            }, 100);
        }

        canvas.addEventListener('mousedown', (e) => {
            const adModal = document.getElementById('adModal');
            if (adModal && adModal.style.display === 'flex') return;
            triggerButtonEffect();
            handleAction();
        });

        canvas.addEventListener('touchstart', (e) => {
            const adModal = document.getElementById('adModal');
            if (adModal && adModal.style.display === 'flex') return;
            e.preventDefault(); // タッチによる二重発火防止
            triggerButtonEffect();
            handleAction();
        });

        // キーボード（Spaceキー）
        window.addEventListener('keydown', (e) => {
            const adModal = document.getElementById('adModal');
            if (adModal && adModal.style.display === 'flex') return;

            if (e.code === 'Space') {
                e.preventDefault(); // 画面スクロール防止
                triggerButtonEffect();
                handleAction();
            }
        });

        // ==========================================
        // 初期化・開始
        // ==========================================
        draw();
        update();
    </script>
</body>
</html>
