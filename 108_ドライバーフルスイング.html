<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>【ドライバーフルスイング！】 | MY WEB LAB</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 22px;
            margin: 0;
            color: #776e65;
        }
        .scores {
            display: flex;
            gap: 8px;
        }
        .score-box {
            background: #bbada0;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            min-width: 50px;
        }
        .score-box span {
            display: block;
            font-size: 14px;
            margin-top: 2px;
        }
        canvas {
            background-color: #8f7a66;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 320px;
            height: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info {
            font-size: 12px;
            color: #8f7a66;
            text-align: left;
        }
        button {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:active {
            background: #776e65;
        }

        /* 広告モーダル用CSS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-content {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            max-width: 330px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .modal-title {
            font-size: 14px;
            color: #776e65;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .ad-container {
            width: 300px;
            height: 250px;
            margin: 0 auto 15px auto;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .close-btn {
            background-color: #f65e3b;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
        }
        .close-btn:active {
            background-color: #e04b28;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: left; margin-bottom: 8px;">
            <a href="index.html" style="text-decoration:none; color:#776e65; font-size:12px;">← ポータルへ戻る</a>
        </div>

        <div class="header">
            <h1>フルスイング！</h1>
            <div class="scores">
                <div class="score-box">SCORE<span id="score">0</span></div>
                <div class="score-box">BEST<span id="best">0</span></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="320" height="400"></canvas>

        <div class="controls">
            <div class="info">画面タップ / Space でショット！</div>
            <button id="btnRestart" onclick="resetGame()">リセット</button>
        </div>
    </div>

    <!-- 広告用モーダル -->
    <div id="adModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">SPONSORED</div>
            <div class="ad-container">
                <!-- 忍者admaxスクリプト -->
                <script src="https://adm.shinobi.jp/s/41668834bee0323cdbe5394799c385f4"></script>
            </div>
            <button class="close-btn" onclick="closeAdModal()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'READY';

        let gauge1Val = 0; // パワー (%)
        let gauge2Val = 0; // ミート (%)
        let gauge1Dir = 1;
        let gauge2Dir = 1;
        const GAUGE_SPEED_1 = 2.2;
        const GAUGE_SPEED_2 = 3.0;

        let totalScore = 0; // 飛距離 (ヤード)
        let bestScore = parseInt(localStorage.getItem('golf_best_score') || '0', 10);

        // 演出用変数
        let swingTimer = 0;
        let ballX = 160, ballY = 320, ballZ = 0;
        let ballVx = 0, ballVy = 0, ballVz = 0;
        let screenShake = 0;
        let explosionParticles = [];
        let resultRank = null;
        let ballTrail = []; // 軌道履歴
        let isBreakThrough = false; // ★5（打ち抜き）フラグ

        document.getElementById('best').innerText = bestScore;

        const RANK_CONFIGS = [
            { minScore: 190, title: '★5【伝説のフルスイング】', text: '限界突破！ナイスショット！', minYd: 501, maxYd: 650, color: '#f1c40f' },
            { minScore: 150, title: '★4【ナイスショット！】', text: '綺麗な放物線で遠くへ！', minYd: 300, maxYd: 350, color: '#2ecc71' },
            { minScore: 100, title: '★3【ナイスイン！】', text: 'まずまずの飛距離！', minYd: 200, maxYd: 250, color: '#3498db' },
            { minScore: 50,  title: '★2【チョロ・スライス】', text: '右へ大きく曲がった…', minYd: 50,  maxYd: 100, color: '#e67e22' },
            { minScore: 0,   title: '★1【大失敗】',         text: 'ネットや隣の打席へすっ飛んだ！', minYd: 0,   maxYd: 0,   color: '#e74c3c' }
        ];

        function init() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    handleInput();
                }
            });

            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                handleInput();
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleInput();
            }, { passive: false });

            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function handleInput() {
            if (document.getElementById('adModal').style.display === 'flex') return;

            if (gameState === 'READY') {
                gameState = 'GAUGE1';
            } else if (gameState === 'GAUGE1') {
                gameState = 'GAUGE2';
            } else if (gameState === 'GAUGE2') {
                gameState = 'SWING';
                startSwingProcess();
            }
            // RESULT状態では画面タップによるリスタートは受け付けない
        }

        function resetGame() {
            gameState = 'READY';
            gauge1Val = 0;
            gauge2Val = 0;
            gauge1Dir = 1;
            gauge2Dir = 1;
            swingTimer = 0;
            ballX = 160;
            ballY = 320;
            ballZ = 0;
            screenShake = 0;
            explosionParticles = [];
            ballTrail = [];
            isBreakThrough = false;
            resultRank = null;
            document.getElementById('score').innerText = '0';
        }

        function startSwingProcess() {
            swingTimer = 0;
            ballTrail = [{ x: 160, y: 330 }];
            const combinedScore = gauge1Val + gauge2Val;
            
            resultRank = RANK_CONFIGS.find(r => combinedScore >= r.minScore) || RANK_CONFIGS[RANK_CONFIGS.length - 1];

            if (resultRank.minYd === resultRank.maxYd) {
                totalScore = resultRank.minYd;
            } else {
                const ratio = (combinedScore - resultRank.minScore) / 40;
                const clampedRatio = Math.max(0, Math.min(1, ratio));
                totalScore = Math.floor(resultRank.minYd + (resultRank.maxYd - resultRank.minYd) * clampedRatio);
            }

            document.getElementById('score').innerText = totalScore;
            if (totalScore > bestScore) {
                bestScore = totalScore;
                localStorage.setItem('golf_best_score', bestScore.toString());
                document.getElementById('best').innerText = bestScore;
            }

            isBreakThrough = combinedScore >= 190;

            if (isBreakThrough) {
                ballVx = 0;
                ballVy = -8;
                ballVz = 14;
            } else if (combinedScore >= 150) {
                ballVx = 0;
                ballVy = -4.5;
                ballVz = 7;
            } else if (combinedScore >= 100) {
                ballVx = (Math.random() - 0.5) * 1.5;
                ballVy = -3.5;
                ballVz = 5;
            } else if (combinedScore >= 50) {
                ballVx = 3.5;
                ballVy = -1.8;
                ballVz = 4;
            } else {
                ballVx = -5;
                ballVy = -0.5;
                ballVz = 1;
            }
        }

        function handleGameOver() {
            setTimeout(() => {
                document.getElementById('adModal').style.display = 'flex';
            }, 1200);
        }

        function closeAdModal() {
            document.getElementById('adModal').style.display = 'none';
            resetGame();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState === 'GAUGE1') {
                gauge1Val += GAUGE_SPEED_1 * gauge1Dir;
                if (gauge1Val >= 100) { gauge1Val = 100; gauge1Dir = -1; }
                if (gauge1Val <= 0) { gauge1Val = 0; gauge1Dir = 1; }
            } else if (gameState === 'GAUGE2') {
                gauge2Val += GAUGE_SPEED_2 * gauge2Dir;
                if (gauge2Val >= 100) { gauge2Val = 100; gauge2Dir = -1; }
                if (gauge2Val <= 0) { gauge2Val = 0; gauge2Dir = 1; }
            } else if (gameState === 'SWING') {
                swingTimer++;
                if (swingTimer > 15) {
                    gameState = 'BALL_FLIGHT';
                    swingTimer = 0;

                    if (isBreakThrough) {
                        screenShake = 14;
                        for (let i = 0; i < 40; i++) {
                            explosionParticles.push({
                                x: 160,
                                y: 310,
                                vx: (Math.random() - 0.5) * 12,
                                vy: (Math.random() - 0.5) * 12,
                                life: 30,
                                color: `hsl(${Math.random() * 60 + 10}, 100%, 50%)`
                            });
                        }
                    }
                }
            } else if (gameState === 'BALL_FLIGHT') {
                swingTimer++;

                ballX += ballVx;
                ballY += ballVy;
                ballZ += ballVz;
                ballVz -= 0.3;

                let rawDrawY = ballY - ballZ;
                let finalDrawY = rawDrawY;

                if (!isBreakThrough) {
                    const minYLimit = 70;
                    if (finalDrawY < minYLimit) {
                        finalDrawY = minYLimit + (minYLimit - finalDrawY) * 0.1;
                    }
                }

                ballTrail.push({ x: ballX, y: finalDrawY });

                for (let i = explosionParticles.length - 1; i >= 0; i--) {
                    let p = explosionParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    if (p.life <= 0) explosionParticles.splice(i, 1);
                }

                if (screenShake > 0) screenShake *= 0.88;

                if (swingTimer > 60) {
                    gameState = 'RESULT';
                    handleGameOver();
                }
            }
        }

        function render() {
            ctx.save();

            if (screenShake > 0.5) {
                const rx = (Math.random() - 0.5) * screenShake;
                const ry = (Math.random() - 0.5) * screenShake;
                ctx.translate(rx, ry);
            }

            drawBackground();

            if (ballTrail.length > 1) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(ballTrail[0].x, ballTrail[0].y);
                for (let i = 1; i < ballTrail.length; i++) {
                    ctx.lineTo(ballTrail[i].x, ballTrail[i].y);
                }
                ctx.stroke();
            }

            drawBooth2FAndPlayer();

            for (let p of explosionParticles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            drawGauges();
            drawOverlayUI();

            ctx.restore();
        }

        function drawBackground() {
            // 空（青空）
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 130);
            skyGrad.addColorStop(0, '#2980b9');
            skyGrad.addColorStop(1, '#6dd5fa');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 320, 130);

            // 広大な緑のフェアウェイ
            const grassGrad = ctx.createLinearGradient(0, 130, 0, 280);
            grassGrad.addColorStop(0, '#218c74');
            grassGrad.addColorStop(0.3, '#2ed573');
            grassGrad.addColorStop(1, '#10ac84');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, 130, 320, 150);

            // --- 防球ネット（鉄骨支柱・ワイヤー・網目） ---
            ctx.fillStyle = '#1e3799';
            ctx.strokeStyle = '#10ac84';
            ctx.lineWidth = 2;
            const poleXs = [20, 100, 220, 300];
            poleXs.forEach(x => {
                ctx.fillRect(x - 2, 40, 4, 90);
                ctx.beginPath();
                ctx.moveTo(x - 2, 40);
                ctx.lineTo(x + 2, 90);
                ctx.moveTo(x + 2, 40);
                ctx.lineTo(x - 2, 90);
                ctx.stroke();
            });

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.lineWidth = 0.8;
            for (let i = -100; i < 400; i += 12) {
                ctx.beginPath();
                ctx.moveTo(i, 40);
                ctx.lineTo(i + 60, 130);
                ctx.stroke();
            }
            for (let i = -40; i < 460; i += 12) {
                ctx.beginPath();
                ctx.moveTo(i, 40);
                ctx.lineTo(i - 60, 130);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(0, 40);
            ctx.lineTo(320, 40);
            ctx.moveTo(0, 85);
            ctx.lineTo(320, 85);
            ctx.moveTo(0, 130);
            ctx.lineTo(320, 130);
            ctx.stroke();

            // パースライン
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1.5;
            for (let x = -80; x <= 400; x += 35) {
                ctx.beginPath();
                ctx.moveTo(x, 280);
                ctx.lineTo(160 + (x - 160) * 0.15, 130);
                ctx.stroke();
            }
        }

        function drawBooth2FAndPlayer() {
            // 打席床
            const floorGrad = ctx.createLinearGradient(0, 280, 0, 400);
            floorGrad.addColorStop(0, '#34495e');
            floorGrad.addColorStop(1, '#2c3e50');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, 280, 320, 120);

            // 打席マット
            ctx.fillStyle = '#1e824c';
            ctx.fillRect(110, 305, 100, 90);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(110, 305, 100, 90);

            // ボール描画
            if (gameState === 'BALL_FLIGHT' && ballTrail.length > 0) {
                const currentPos = ballTrail[ballTrail.length - 1];
                const drawX = currentPos.x;
                const drawY = currentPos.y;
                const radius = Math.max(1, 5 - (320 - ballY) * 0.02);

                if (drawY > -20 && drawY < 410) {
                    if (drawY > 140) {
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(ballX, ballY, radius, radius * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (gameState === 'READY' || gameState === 'GAUGE1' || gameState === 'GAUGE2' || gameState === 'SWING') {
                ctx.fillStyle = '#333333';
                ctx.fillRect(158, 323, 4, 6); // ゴムティー

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(160, 323, 5, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(160, 320, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // プレイヤー
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.arc(135, 295, 9, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(130, 304, 10, 22);

            // --- ドライバー描画（金属シャフト＋大きなドライバーヘッド） ---
            let startX = 135, startY = 312;
            let endX = 158, endY = 322;
            let headAngle = 0;

            if (gameState === 'SWING') {
                endX = 165; endY = 315;
                headAngle = Math.PI * 0.1;
            } else if (gameState === 'BALL_FLIGHT' || gameState === 'RESULT') {
                endX = 115; endY = 285;
                headAngle = -Math.PI * 0.4;
            } else {
                endX = 158; endY = 322;
                headAngle = 0;
            }

            // 1. シャフト（シルバーの金属ポール）
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // シャフトのハイライト光沢
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // 2. 大型ドライバーヘッド（丸みのある黒〜ガンメタリックのソール）
            ctx.save();
            ctx.translate(endX, endY);
            ctx.rotate(headAngle);

            // クラブヘッド（デカヘッド）
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(3, 0, 7, 5, Math.PI * 0.1, 0, Math.PI * 2);
            ctx.fill();

            // クラブヘッドの金属光沢（クラウンライン）
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 1;
            ctx.stroke();

            // フェース面（インパクト面）のチタンカラーアクセント
            ctx.fillStyle = '#dcdde1';
            ctx.fillRect(2, -4, 2, 8);

            ctx.restore();

            // --- 2階手すり・防球フェンス ---
            ctx.fillStyle = 'rgba(52, 73, 94, 0.4)';
            ctx.fillRect(0, 275, 320, 15);

            ctx.fillStyle = '#bdc3c7';
            for (let x = 10; x <= 310; x += 60) {
                ctx.fillRect(x, 270, 5, 22);
            }

            const railGrad = ctx.createLinearGradient(0, 268, 0, 273);
            railGrad.addColorStop(0, '#ffffff');
            railGrad.addColorStop(0.5, '#95a5a6');
            railGrad.addColorStop(1, '#7f8c8d');
            ctx.fillStyle = railGrad;
            ctx.fillRect(0, 268, 320, 5);
        }

        function drawGauges() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(10, 10, 300, 75);

            drawGaugeBar(20, 20, 280, 18, gauge1Val, '1: パワー', '#e74c3c', gameState === 'GAUGE1');
            drawGaugeBar(20, 52, 280, 18, gauge2Val, '2: ミート', '#3498db', gameState === 'GAUGE2');
        }

        function drawGaugeBar(x, y, w, h, val, label, color, isActive) {
            ctx.fillStyle = isActive ? '#ffffff' : '#aaaaaa';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(label, x, y - 3);

            ctx.fillStyle = '#222222';
            ctx.fillRect(x, y, w, h);

            const fillWidth = (w * val) / 100;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, fillWidth, h);

            if (isActive) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${Math.floor(val)}%`, x + w - 5, y + 13);
        }

        function drawOverlayUI() {
            ctx.textAlign = 'center';

            if (gameState === 'READY') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(30, 150, 260, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('画面タップでスタート！', 160, 180);
            } else if (gameState === 'RESULT' && resultRank) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
                ctx.fillRect(20, 105, 280, 160);

                ctx.fillStyle = resultRank.color;
                ctx.font = 'bold 17px sans-serif';
                ctx.fillText(resultRank.title, 160, 138);

                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.fillText(resultRank.text, 160, 168);

                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 38px sans-serif';
                ctx.fillText(`${totalScore} yd`, 160, 220);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
