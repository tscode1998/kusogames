<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ペンギンぺんぺん | MY WEB LAB</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 28px;
            margin: 0;
            color: #776e65;
        }
        .scores {
            display: flex;
            gap: 8px;
        }
        .score-box {
            background: #bbada0;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            min-width: 50px;
        }
        .score-box span {
            display: block;
            font-size: 14px;
            margin-top: 2px;
        }
        canvas {
            background-color: #8f7a66;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 320px;
            height: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info {
            font-size: 12px;
            color: #8f7a66;
        }
        button {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:active {
            background: #776e65;
        }

        /* 広告モーダル用CSS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-content {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            max-width: 330px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .modal-title {
            font-size: 14px;
            color: #776e65;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .ad-container {
            width: 300px;
            height: 250px;
            margin: 0 auto 15px auto;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .close-btn {
            background-color: #f65e3b;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
        }
        .close-btn:active {
            background-color: #e04b28;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: left; margin-bottom: 8px;">
            <a href="index.html" style="text-decoration:none; color:#776e65; font-size:12px;">← ポータルへ戻る</a>
        </div>

        <div class="header">
            <h1>ペンギンぺんぺん</h1>
            <div class="scores">
                <div class="score-box">SCORE<span id="score">0</span></div>
                <div class="score-box">BEST<span id="best">0</span></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="320" height="400"></canvas>

        <div class="controls">
            <div class="info">穴をタップ！シロクマはNG</div>
            <button id="btnRestart" onclick="resetGame()">リセット</button>
        </div>
    </div>

    <!-- 広告用モーダル -->
    <div id="adModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">SPONSORED</div>
            <div class="ad-container">
                <!-- 忍者admaxスクリプト -->
                <script src="https://adm.shinobi.jp/s/41668834bee0323cdbe5394799c385f4"></script>
            </div>
            <button class="close-btn" onclick="closeAdModal()">もう一度プレイ</button>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 320, H = 400;
    const GAME_MS = 30000, READY_MS = 3000;
    const HX = [60, 160, 260], HY = [135, 230, 325];
    const TYPES = {
        emperor: { life: 1000, pts: 10 },
        rock:    { life: 600,  pts: 30 },
        bear:    { life: 1000, pts: -20 }
    };

    let state = 'title'; // title | ready | play | result
    let score = 0, best = 0, kills = 0, combo = 0, maxCombo = 0, newRecord = false;
    let readyAt = 0, startAt = 0, nextSpawn = 0, timeLeft = 30;
    let ents = [], parts = [], flakes = [];
    let shake = 0, redFlash = 0;

    try { best = parseInt(localStorage.getItem('penguinPanicBest')) || 0; } catch (e) {}
    document.getElementById('best').textContent = best;

    function isModalOpen() {
        return document.getElementById('adModal').style.display === 'flex';
    }

    /* ---------- Audio ---------- */
    let ac = null, bgmTimer = null, bgmStep = 0, fast = false;
    function initAudio() {
        if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (ac && ac.state === 'suspended') ac.resume();
    }
    function tone(f1, f2, dur, type, vol) {
        if (!ac) return;
        const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f1, t);
        o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(vol || 0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + dur);
    }
    const sPop  = () => tone(400, 900, 0.1, 'sine', 0.08);   // ピョコッ
    const sHit  = () => { tone(900, 1400, 0.07, 'square', 0.12); tone(520, 180, 0.18, 'triangle', 0.45); setTimeout(() => tone(1200, 1800, 0.08, 'sine', 0.12), 50); }; // ポコッ
    const sBear = () => { tone(220, 110, 0.4, 'sawtooth', 0.3); tone(165, 70, 0.45, 'square', 0.2); setTimeout(() => tone(150, 60, 0.35, 'sawtooth', 0.3), 180); }; // ブブーッ
    const sMiss = () => tone(200, 120, 0.06, 'square', 0.03);
    const MELODY = [523,659,784,659, 587,698,880,698, 523,659,784,1047, 988,784,659,587];
    function bgmTick() {
        if (state !== 'play') return;
        const n = MELODY[bgmStep % MELODY.length];
        tone(n, n, 0.15, 'triangle', 0.05);
        if (bgmStep % 4 === 0) tone(n / 2, n / 2, 0.2, 'sine', 0.06);
        bgmStep++;
        bgmTimer = setTimeout(bgmTick, fast ? 130 : 210);
    }
    function startBgm() { stopBgm(); bgmStep = 0; fast = false; bgmTimer = setTimeout(bgmTick, 100); }
    function stopBgm() { clearTimeout(bgmTimer); bgmTimer = null; }

    /* ---------- Game flow ---------- */
    function beginReady() {
        score = 0; kills = 0; combo = 0; maxCombo = 0; newRecord = false;
        ents = []; parts = []; flakes = []; timeLeft = 30;
        document.getElementById('score').textContent = 0;
        state = 'ready';
        readyAt = performance.now();
    }
    function resetGame() {
        stopBgm();
        initAudio();
        beginReady();
    }
    function startPlay() {
        state = 'play';
        startAt = performance.now();
        nextSpawn = startAt + 300;
        startBgm();
    }
    function endGame() {
        state = 'result';
        stopBgm();
        ents = [];
        if (score > best) {
            best = score; newRecord = true;
            try { localStorage.setItem('penguinPanicBest', best); } catch (e) {}
            document.getElementById('best').textContent = best;
        }
        handleGameOver();
    }
    function handleGameOver() {
        setTimeout(() => {
            document.getElementById('adModal').style.display = 'flex';
        }, 1000);
    }
    function closeAdModal() {
        document.getElementById('adModal').style.display = 'none';
        resetGame();
    }

    /* ---------- Spawning ---------- */
    function spawn(now, elapsed) {
        const sec = elapsed / 1000;
        const phase = sec < 10 ? 0 : sec < 20 ? 1 : 2;
        const interval = [800, 600, 400][phase], maxN = [1, 2, 3][phase];
        if (now < nextSpawn) return;
        nextSpawn = now + interval;
        if (ents.length >= maxN) return;
        const used = ents.map(e => e.hole);
        const free = [0,1,2,3,4,5,6,7,8].filter(i => !used.includes(i));
        if (!free.length) return;
        const r = Math.random();
        const type = r < 0.7 ? 'emperor' : r < 0.9 ? 'rock' : 'bear';
        ents.push({ hole: free[Math.floor(Math.random() * free.length)], type, born: now, life: TYPES[type].life, hit: false, hitAt: 0 });
        sPop();
    }

    /* ---------- Effects ---------- */
    function burst(x, y, kind) {
        const n = kind === 'snow' ? 10 : 8;
        for (let i = 0; i < n; i++) {
            const a = Math.PI * 2 * i / n + Math.random() * 0.5, s = 1 + Math.random() * 2.5;
            parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 0, max: 500, kind });
        }
    }
    function popup(x, y, text, color, size) {
        parts.push({ x, y, vx: 0, vy: -1, life: 0, max: 700, kind: 'text', text, color, size: size || 22 });
    }

    /* ---------- Input ---------- */
    function holeAt(px, py) {
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
            // 判定は最小44px四方を大きく上回る 80x84 の矩形
            if (Math.abs(px - HX[c]) <= 40 && py >= HY[r] - 66 && py <= HY[r] + 20) return r * 3 + c;
        }
        return -1;
    }
    function handleTap(px, py) {
        initAudio();
        if (state === 'title' || state === 'result') {
            if (px > 90 && px < 230 && py > 260 && py < 312) resetGame();
            return;
        }
        if (state !== 'play') return;
        const h = holeAt(px, py);
        if (h < 0) return;
        const now = performance.now();
        const e = ents.find(en => en.hole === h && !en.hit);
        const x = HX[h % 3], y = HY[Math.floor(h / 3)];
        if (!e) { combo = 0; sMiss(); return; }
        e.hit = true; e.hitAt = now;
        if (e.type === 'bear') {
            score = Math.max(0, score - 20);
            combo = 0;
            burst(x, y - 30, 'smoke');
            popup(x, y - 75, 'NG!! -20', '#ff2a2a', 30);
            parts.push({ x, y: y - 30, vx: 0, vy: 0, life: 0, max: 600, kind: 'x' });
            sBear();
            shake = 16; redFlash = 1;
            if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
        } else {
            const mult = (combo >= 3 && combo % 3 === 0 ? 1.5 : 1) * (timeLeft <= 5 ? 2 : 1);
            const pts = Math.round(TYPES[e.type].pts * mult);
            score += pts; kills++; combo++;
            if (combo > maxCombo) maxCombo = combo;
            burst(x, y - 30, 'snow');
            popup(x, y - 60, '+' + pts, mult > 1 ? '#ffd23f' : '#ffffff');
            sHit();
        }
        document.getElementById('score').textContent = score;
    }
    function pos(clientX, clientY) {
        const r = canvas.getBoundingClientRect();
        return [(clientX - r.left) * W / r.width, (clientY - r.top) * H / r.height];
    }
    canvas.addEventListener('mousedown', ev => {
        if (isModalOpen()) return;
        const p = pos(ev.clientX, ev.clientY); handleTap(p[0], p[1]);
    });
    canvas.addEventListener('touchstart', ev => {
        if (isModalOpen()) return;
        ev.preventDefault();
        const t = ev.changedTouches[0], p = pos(t.clientX, t.clientY); handleTap(p[0], p[1]);
    }, { passive: false });
    document.addEventListener('keydown', ev => {
        if (isModalOpen()) return;
        if ((ev.key === 'Enter' || ev.key === ' ') && (state === 'title' || state === 'result')) {
            ev.preventDefault(); resetGame();
        }
    });

    /* ---------- Drawing ---------- */
    function ell(x, y, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
    function drawCreature(type, x, y) {
        if (type === 'bear') {
            ell(x - 18, y - 62, 7, 7, '#fff'); ell(x + 18, y - 62, 7, 7, '#fff');
            ell(x, y - 26, 28, 30, '#f4fafd');
            ell(x, y - 46, 22, 19, '#ffffff');
            ell(x, y - 40, 9, 7, '#e3eef5');
            ell(x, y - 43, 4, 3, '#222');
            ell(x - 9, y - 50, 3.5, 3.5, '#e02020'); ell(x + 9, y - 50, 3.5, 3.5, '#e02020');
            ctx.strokeStyle = '#a00'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(x - 16, y - 59); ctx.lineTo(x - 5, y - 53); ctx.moveTo(x + 16, y - 59); ctx.lineTo(x + 5, y - 53); ctx.stroke();
            return;
        }
        const s = type === 'rock' ? 0.85 : 1;
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
        ell(0, -26, 24, 30, type === 'rock' ? '#1f2a36' : '#2b3a4a');
        ell(0, -22, 15, 23, '#fafafa');
        ell(0, -52, 16, 15, type === 'rock' ? '#1f2a36' : '#2b3a4a');
        if (type === 'emperor') { ell(-10, -48, 4, 6, '#ffc83d'); ell(10, -48, 4, 6, '#ffc83d'); }
        else {
            ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(-6, -62); ctx.lineTo(-20, -72); ctx.moveTo(6, -62); ctx.lineTo(20, -72); ctx.stroke();
        }
        ell(-6, -54, 3, 3, type === 'rock' ? '#e33' : '#fff'); ell(6, -54, 3, 3, type === 'rock' ? '#e33' : '#fff');
        ell(-6, -54, 1.3, 1.3, '#111'); ell(6, -54, 1.3, 1.3, '#111');
        ctx.fillStyle = '#ff9a1f'; ctx.beginPath(); ctx.moveTo(-5, -49); ctx.lineTo(5, -49); ctx.lineTo(0, -41); ctx.fill();
        ctx.restore();
    }
    function riseP(e, now) {
        if (e.hit) return Math.max(0, 1 - (now - e.hitAt) / 150);
        const age = now - e.born;
        if (age < 150) return age / 150;
        if (age > e.life - 150) return Math.max(0, (e.life - age) / 150);
        return 1;
    }
    function drawHoles(now) {
        for (let i = 0; i < 9; i++) {
            const x = HX[i % 3], y = HY[Math.floor(i / 3)];
            ell(x, y + 2, 38, 15, '#5a4a3d');
            ell(x, y, 34, 12, '#2a2118');
            const e = ents.find(en => en.hole === i);
            if (e && e.type === 'bear' && !e.hit) {
                ctx.strokeStyle = 'rgba(224,32,32,' + (0.5 + 0.5 * Math.sin(now / 80)) + ')'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.ellipse(x, y + 2, 42, 18, 0, 0, Math.PI * 2); ctx.stroke();
            }
            if (e) {
                const p = riseP(e, now);
                ctx.save();
                ctx.beginPath(); ctx.rect(x - 50, y - 100, 100, 100 + 2); ctx.clip();
                drawCreature(e.type, x, y + (1 - p) * 62 + 4);
                ctx.restore();
            }
            if (e && e.type === 'bear' && !e.hit) txt('NG', x, y - 78, 14, '#e02020');
            ctx.strokeStyle = '#e8f4fb'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.ellipse(x, y + 1, 36, 13, 0, 0.05 * Math.PI, 0.95 * Math.PI); ctx.stroke();
        }
    }
    function drawBg() {
        ctx.fillStyle = '#8f7a66'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#cfe8f5'; ctx.fillRect(8, 56, W - 16, 300);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        for (let i = 0; i < 6; i++) ctx.fillRect(20 + i * 50, 70 + (i % 3) * 90, 26, 3);
    }
    function btn(label, y) {
        ctx.fillStyle = '#f65e3b';
        ctx.beginPath(); ctx.roundRect(90, y, 140, 50, 25); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(label, 160, y + 32);
    }
    function txt(s, x, y, size, col) {
        ctx.fillStyle = col; ctx.font = 'bold ' + size + 'px -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'center'; ctx.fillText(s, x, y);
    }
    function drawParts(now, dt) {
        for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i]; p.life += dt;
            if (p.life > p.max) { parts.splice(i, 1); continue; }
            p.x += p.vx; p.y += p.vy;
            const a = 1 - p.life / p.max;
            ctx.globalAlpha = a;
            if (p.kind === 'text') txt(p.text, p.x, p.y, p.size, p.color);
            else if (p.kind === 'x') { ctx.strokeStyle = '#e02020'; ctx.lineWidth = 10; ctx.lineCap = 'round'; const k = 22 + p.life / 25; ctx.beginPath(); ctx.moveTo(p.x - k, p.y - k); ctx.lineTo(p.x + k, p.y + k); ctx.moveTo(p.x + k, p.y - k); ctx.lineTo(p.x - k, p.y + k); ctx.stroke(); }
            else if (p.kind === 'snow') { txt('❄', p.x, p.y, 16, '#ffffff'); }
            else ell(p.x, p.y, 6 + p.life / 60, 6 + p.life / 60, '#eef3f6');
            ctx.globalAlpha = 1;
        }
    }
    function drawBlizzard() {
        for (let i = 0; i < 3; i++) flakes.push({ x: Math.random() * W + 40, y: -5, vx: -3 - Math.random() * 3, vy: 3 + Math.random() * 3 });
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        for (let i = flakes.length - 1; i >= 0; i--) {
            const f = flakes[i]; f.x += f.vx; f.y += f.vy;
            if (f.y > H || f.x < -10) { flakes.splice(i, 1); continue; }
            ctx.fillRect(f.x, f.y, 3, 3);
        }
    }

    /* ---------- Main loop ---------- */
    let last = performance.now();
    function frame(now) {
        const dt = Math.min(50, now - last); last = now;
        ctx.save();
        if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.85; if (shake < 0.5) shake = 0; }
        drawBg();

        if (state === 'play') {
            const elapsed = now - startAt;
            timeLeft = Math.max(0, (GAME_MS - elapsed) / 1000);
            if (timeLeft <= 5) fast = true;
            ents = ents.filter(e => !(e.hit ? now - e.hitAt > 150 : now - e.born > e.life));
            spawn(now, elapsed);
            if (elapsed >= GAME_MS) endGame();
        }

        if (state === 'title') {
            drawHoles(now);
            ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
            txt('🐧 ペンギンぺんぺん', 160, 130, 26, '#fff');
            txt('30秒でペンギンを撃退しよう！', 160, 170, 14, '#fff');
            txt('HIGH SCORE: ' + best, 160, 215, 18, '#ffd23f');
            btn('スタート', 260);
        } else if (state === 'result') {
            drawHoles(now);
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
            txt('RESULT', 160, 70, 26, '#fff');
            txt('SCORE ' + score, 160, 120, 30, '#ffd23f');
            if (newRecord) txt('🎉 ハイスコア更新！', 160, 152, 16, '#ff9a8a');
            txt('撃退数: ' + kills, 160, 190, 18, '#fff');
            txt('最大コンボ: ' + maxCombo, 160, 220, 18, '#fff');
            txt('HIGH SCORE: ' + best, 160, 250, 14, '#ddd');
            btn('リトライ', 275);
        } else {
            drawHoles(now);
            // HUD
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, 48);
            ctx.textAlign = 'left';
            ctx.fillStyle = timeLeft <= 5 ? '#ff7a5c' : '#fff'; ctx.font = 'bold 22px sans-serif';
            ctx.fillText('⏱ ' + Math.ceil(timeLeft), 12, 32);
            ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
            ctx.fillText('SCORE ' + score, W - 12, 32);
            // Combo
            if (state === 'play') {
                const boosted = combo >= 3 && combo % 3 === 0;
                txt(combo >= 2 ? combo + ' COMBO' + (boosted ? '  ×1.5 READY!' : '') : '', 160, 382, 18, boosted ? '#ffd23f' : '#fff');
                if (timeLeft <= 5) { drawBlizzard(); txt('LAST SPURT ×2', 160, 74, 14, '#fff'); }
            }
            if (state === 'ready') {
                const left = READY_MS - (now - readyAt);
                if (left <= 0) startPlay();
                else {
                    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, W, H);
                    txt(String(Math.ceil(left / 1000)), 160, 225, 90, '#fff');
                    txt('よ～い…', 160, 120, 20, '#fff');
                }
            }
        }
        drawParts(now, dt);
        if (redFlash > 0) { ctx.fillStyle = 'rgba(230,20,20,' + (redFlash * 0.5) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); redFlash = Math.max(0, redFlash - dt / 400); }
        ctx.restore();
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    </script>
</body>
