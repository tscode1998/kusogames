    <script>
    // ===== 定数・状態 =====
    const cv = document.getElementById('gameCanvas'), cx = cv.getContext('2d');
    const W = 320, H = 400, GY = 300, CATX = 90, HITX = 140, STORE = 'lazyArcade112CatSkateBest';
    // 段階ごとの設定: gap=スポット間隔 app=輪が縮む時間 pw=PERFECT判定(±ms)
    const CFG = [{gap:1500, app:1100, pw:90}, {gap:1250, app:900, pw:78}, {gap:1000, app:750, pw:66}];
    // ボタン: 0=JUMP 1=GRIND 2=FLIP
    const ACT = [{c:'#ff9f43'}, {c:'#7df9ff'}, {c:'#b66bff'}];
    // 障害物: 0=ジャンプ台(JUMP) 1=レール(GRIND) 2=ベンチ(FLIP) 3=壁(JUMP→空中でJUMP の二段ジャンプ)
    const SP = [
        {name:'オーリー', need:0, label:'JUMP'},
        {name:'グラインド', need:1, label:'GRIND'},
        {name:'キックフリップ', need:2, label:'FLIP'},
        {name:'二段ジャンプ', need:0, label:'JUMP×2'}
    ];
    const GAP2 = 420;                                     // 二段ジャンプの1回目→2回目の間隔(ms)
    const TH = [[2000, 'B'], [5000, 'A'], [8000, 'S']];

    let state = 'title'; // title | ready | play | result
    let score = 0, best = 0, combo = 0, maxCombo = 0, newRecord = false, perfects = 0, goods = 0, misses = 0;
    let readyAt = 0, startAt = 0, nextSpawn = 0, timeLeft = 30, curLv = 0;
    let stunUntil = 0, trick = null, flash = 0, scroll = 0, lastT = 0, lastType = -1, lastCatY = GY, hintAct = -2;
    let spots = [], parts = [], pops = [];
    const padBtns = [document.getElementById('btnJump'), document.getElementById('btnGrind'), document.getElementById('btnFlip')];

    try { best = parseInt(localStorage.getItem(STORE)) || 0; } catch (e) {}
    document.getElementById('best').textContent = best;

    function lv(el) { return Math.min(2, Math.floor(el / 10000)); }
    function rankOf(s) { let r = 'C'; for (const t of TH) if (s >= t[0]) r = t[1]; return r; }
    function setHint(a) {
        if (a === hintAct) return;
        hintAct = a;
        padBtns.forEach((b, i) => b.classList.toggle('hint', i === a));
    }

    // 街並みシルエット（疑似乱数で固定生成）
    function mkCity(seed) {
        const a = []; let x = 0, r = seed;
        while (x < 640) {
            r = (r * 9301 + 49297) % 233280; const w = 26 + (r % 30);
            r = (r * 9301 + 49297) % 233280; const h = 60 + (r % 110);
            a.push({x: x, w: w, h: h}); x += w + (r % 6);
        }
        return a;
    }
    const cityFar = mkCity(7), cityNear = mkCity(31);

    // ===== 音（Web Audio API・オシレーターのみ） =====
    let ac = null, bgmOn = true, seOn = true, bgmTimer = null, step = 0, nextT = 0;
    function initAudio() {
        if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
        try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    function tone(f, t, d, type, vol, f2) {
        if (!ac) return;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    }
    function sfx(k) {
        if (!ac || !seOn) return;
        const t = ac.currentTime;
        if (k === 'good') { tone(660, t, 0.1, 'square', 0.1, 990); }
        else if (k === 'perfect') { tone(660, t, 0.08, 'square', 0.1); tone(880, t + 0.07, 0.08, 'square', 0.1); tone(1320, t + 0.14, 0.18, 'square', 0.1); }
        else if (k === 'dj') { tone(880, t, 0.12, 'square', 0.1, 1760); }
        else if (k === 'grind') { tone(300, t, 0.15, 'sawtooth', 0.07, 700); }
        else if (k === 'miss') { tone(320, t, 0.4, 'sine', 0.25, 70); tone(240, t + 0.05, 0.35, 'triangle', 0.15, 60); }
        else if (k === 'tick') { tone(440, t, 0.08, 'square', 0.08); }
        else if (k === 'go') { tone(880, t, 0.25, 'square', 0.1); }
        else if (k === 'end') { [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.13, 0.25, 'square', 0.1)); }
    }
    const BASS = [55,0,55,82,0,55,73,0, 65,0,65,98,0,65,82,0];
    function playStep(s, t) {
        if (s % 2 === 0) tone(130, t, 0.12, 'sine', 0.3, 40);        // キック（4つ打ち）
        else tone(6000, t, 0.03, 'square', 0.015);                    // ハイハット
        if (BASS[s]) tone(BASS[s] * 2, t, 0.2, 'triangle', 0.16);     // ベース
    }
    function sched() {
        if (!ac) return;
        while (nextT < ac.currentTime + 0.15) {
            if (bgmOn) playStep(step, nextT);
            step = (step + 1) % 16; nextT += 0.242;
        }
    }
    function startBgm() { if (!ac) return; stopBgm(); step = 0; nextT = ac.currentTime + 0.05; bgmTimer = setInterval(sched, 40); }
    function stopBgm() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }
    document.getElementById('btnBgm').addEventListener('click', function () {
        initAudio(); bgmOn = !bgmOn; this.classList.toggle('off', !bgmOn); this.blur();
    });
    document.getElementById('btnSe').addEventListener('click', function () {
        initAudio(); seOn = !seOn; this.classList.toggle('off', !seOn); this.blur();
    });

    // ===== 進行処理（元ゲームの考え方を踏襲） =====
    function isModalOpen() {
        return document.getElementById('adModal').style.display === 'flex';
    }

    function beginReady() {
        score = 0; combo = 0; maxCombo = 0; newRecord = false; perfects = 0; goods = 0; misses = 0;
        spots = []; parts = []; pops = []; timeLeft = 30; curLv = 0; lastType = -1;
        stunUntil = 0; trick = null; flash = 0;
        document.getElementById('score').textContent = 0;
        state = 'ready';
        readyAt = performance.now();
    }
    function resetGame() {
        stopBgm();
        initAudio();
        beginReady();
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }

    function endGame() {
        state = 'result';
        stopBgm();
        spots = []; trick = null;
        sfx('end');
        if (score > best) {
            best = score; newRecord = true;
            try { localStorage.setItem(STORE, best); } catch (e) {}
            document.getElementById('best').textContent = best;
        }
        handleGameOver();
    }
    function handleGameOver() {
        setTimeout(() => {

    }
    function closeAdModal() {
        document.getElementById('adModal').style.display = 'none';

    }

    // ===== ゲームロジック =====
    function pickType(l) {
        const wp = [0.15, 0.22, 0.28][l];                 // 壁（二段ジャンプ）の出現率
        let t;
        do { t = Math.random() < wp ? 3 : Math.floor(Math.random() * 3); }
        while (t === lastType && Math.random() < 0.7);    // 同じ障害物が連続しにくくする
        lastType = t;
        return t;
    }
    function miss(now, why) {
        combo = 0; misses++;
        stunUntil = Math.max(stunUntil, now + 500); trick = null;
        pops.push({x: CATX + 40, y: 160, t0: now, text: 'MISS', sub: why || '', col: '#ff6b6b'});
        sfx('miss');
    }
    function doAct(act, now) {
        if (now < stunUntil) return;                      // 転倒中は入力不可
        const s = spots.find(q => !q.done);
        if (!s) return;
        const second = s.type === 3 && s.stage === 1;     // 二段ジャンプの2回目
        const d = (second ? s.arrive2 : s.arrive) - now;  // 正=早い / 負=遅い
        if (d > (second ? 330 : 450)) return;             // まだ遠いタップは無視
        const pw = second ? s.pw * 1.2 : s.pw;
        const ad = Math.abs(d);
        if (act !== SP[s.type].need) { s.done = true; miss(now, 'ボタン違い'); return; }
        if (ad > pw * 2) { s.done = true; miss(now, d > 0 ? '早すぎ' : '遅すぎ'); return; }
        const per = ad <= pw;

        if (s.type === 3 && !second) {                    // 壁: 1回目のジャンプ
            s.stage = 1; s.arrive2 = s.arrive + GAP2; s.q1 = per ? 100 : 50;
            trick = {type: 3, start: now, t2: null};
            pops.push({x: CATX + 40, y: 160, t0: now, text: 'JUMP!', sub: 'もう1回！', col: '#ff9f43'});
            sfx('good');
            return;
        }

        s.done = true;
        const mult = Math.min(4, combo + 1);
        let base = per ? 100 : 50, allPer = per;
        if (second) { base += s.q1; allPer = per && s.q1 === 100; }
        score += base * mult;
        if (allPer) perfects++; else goods++;
        combo++; if (combo > maxCombo) maxCombo = combo;
        if (combo >= 4) flash = 1;                        // 4コンボ以上でネオン発光
        document.getElementById('score').textContent = score;
        if (second) { trick.t2 = now; sfx('dj'); } else { trick = {type: s.type, start: now, t2: null}; }
        pops.push({x: CATX + 40, y: 160, t0: now, text: allPer ? 'PERFECT!' : 'GOOD', sub: SP[s.type].name + (mult > 1 ? ' ×' + mult : ''), col: allPer ? '#ffe14d' : '#7df9ff'});
        const col = s.type === 1 ? '#7df9ff' : '#ffe14d';
        for (let i = 0; i < 8; i++) {
            const a = Math.random() * 6.28, v = 60 + Math.random() * 90;
            parts.push({x: CATX, y: s.type === 1 ? GY - 8 : GY - 40, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t0: now, col: col});
        }
        sfx(s.type === 1 ? 'grind' : '');
        sfx(allPer ? 'perfect' : 'good');
    }
    function onAct(a) {
        if (isModalOpen()) return;                        // モーダル表示中は入力無視
        initAudio();
        const now = performance.now();
        if (state === 'title') resetGame();
        else if (state === 'play') doAct(a, now);
    }
    // キャンバスのタップ＝JUMP（1本指でOK）
    cv.addEventListener('pointerdown', e => { if (!e.isPrimary) return; e.preventDefault(); onAct(0); });
    // 操作ボタン
    padBtns.forEach((b, i) => b.addEventListener('pointerdown', e => { e.preventDefault(); onAct(i); }));
    // キーボード: JUMP=Space/↑/Z  GRIND=↓/X  FLIP=→/C
    const KEYMAP = {Space: 0, ArrowUp: 0, KeyZ: 0, ArrowDown: 1, KeyX: 1, ArrowRight: 2, KeyC: 2};
    document.addEventListener('keydown', e => {
        if (!(e.code in KEYMAP) || isModalOpen()) return;
        e.preventDefault();
        if (!e.repeat) onAct(KEYMAP[e.code]);
    });

    // ===== 更新 =====
    let lastTick = -1;
    function update(now, dt) {
        flash = Math.max(0, flash - dt / 400);
        let spd = 150;
        if (state === 'ready') {
            const n = Math.ceil(3 - (now - readyAt) / 700);
            if (n !== lastTick && n >= 1 && n <= 3) { sfx('tick'); }
            lastTick = n;
            if (now - readyAt >= 2400) {
                state = 'play'; startAt = now; nextSpawn = now + 300; curLv = 0;
                sfx('go'); startBgm();
            }
        }
        if (state === 'play') {
            const el = now - startAt;
            if (el >= 30000) { timeLeft = 0; endGame(); }
            else {
                timeLeft = Math.max(0, 30 - el / 1000);
                const l = lv(el), c = CFG[l];
                spd = (W + 30 - HITX) / c.app * 1000;
                if (l !== curLv) {
                    curLv = l;
                    pops.push({x: W / 2, y: 110, t0: now, text: 'SPEED UP!', sub: '', col: '#7df9ff'});
                }
                while (now >= nextSpawn) {
                    spots.push({arrive: nextSpawn + c.app, arrive2: 0, app: c.app, pw: c.pw, type: pickType(l), stage: 0, q1: 0, done: false});
                    nextSpawn += c.gap;
                }
                for (const s of spots) {                  // 遅すぎ判定
                    if (s.done) continue;
                    const lim = s.stage === 1 ? s.arrive2 + s.pw * 2.4 : s.arrive + s.pw * 2;
                    if (now > lim) { s.done = true; miss(now, '遅すぎ'); }
                }
                spots = spots.filter(s => now - (s.stage === 1 ? s.arrive2 : s.arrive) < 800);
                const nx = spots.find(q => !q.done);
                setHint(nx ? SP[nx.type].need : -1);      // 次に押すボタンを光らせる
            }
        } else {
            setHint(-1);
        }
        scroll += dt / 1000 * spd;
        for (const p of parts) { p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.vy += 300 * dt / 1000; }
        parts = parts.filter(p => now - p.t0 < 600);
        pops = pops.filter(p => now - p.t0 < 800);
    }

    // ===== 描画 =====
    function txt(s, x, y, size, col, align, stroke) {
        cx.font = 'bold ' + size + 'px -apple-system, "Segoe UI", sans-serif';
        cx.textAlign = align || 'center';
        if (stroke) { cx.lineWidth = 4; cx.strokeStyle = stroke; cx.strokeText(s, x, y); }
        cx.fillStyle = col; cx.fillText(s, x, y);
    }
    function drawCity(arr, off, col, windows) {
        cx.fillStyle = col;
        const o = ((off % 640) + 640) % 640;
        for (const k of [0, 1]) {
            for (const b of arr) {
                const bx = b.x - o + k * 640;
                if (bx > W || bx + b.w < 0) continue;
                cx.fillStyle = col; cx.fillRect(bx, GY - b.h, b.w, b.h);
                if (windows) {
                    cx.fillStyle = 'rgba(255,225,120,0.7)';
                    for (let yy = GY - b.h + 8; yy < GY - 10; yy += 14)
                        for (let xx = b.x + 5; xx < b.x + b.w - 6; xx += 10)
                            if ((xx * 7 + yy * 3) % 5 < 2) cx.fillRect(xx - o + k * 640, yy, 4, 6);
                }
            }
        }
    }
    function ring(x, y, r, hot, col) {
        cx.shadowBlur = 10; cx.shadowColor = hot ? '#fff700' : col;
        cx.strokeStyle = hot ? '#fff700' : col; cx.lineWidth = hot ? 4 : 3;
        cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.stroke();
        cx.shadowBlur = 0;
    }
    function drawSpot(s, now) {
        const d = s.arrive - now;
        const x = HITX + d / s.app * (W + 30 - HITX);
        if (x < -60 || x > W + 60) return;
        const ac2 = ACT[SP[s.type].need].c;
        if (s.type === 0) {                                // ジャンプ台
            cx.fillStyle = '#ff9f43'; cx.beginPath(); cx.moveTo(x - 26, GY); cx.lineTo(x + 22, GY); cx.lineTo(x + 22, GY - 26); cx.closePath(); cx.fill();
        } else if (s.type === 1) {                         // レール
            cx.fillStyle = '#cfd8ff'; cx.fillRect(x - 30, GY - 22, 60, 4); cx.fillRect(x - 26, GY - 18, 4, 18); cx.fillRect(x + 22, GY - 18, 4, 18);
        } else if (s.type === 2) {                         // ベンチ
            cx.fillStyle = '#b66bff'; cx.fillRect(x - 26, GY - 24, 52, 8); cx.fillRect(x - 22, GY - 16, 5, 16); cx.fillRect(x + 17, GY - 16, 5, 16);
        } else {                                           // 壁（コンテナ）
            cx.fillStyle = '#ff5d73'; cx.fillRect(x - 18, GY - 44, 36, 44);
            cx.fillStyle = '#c93a54';
            for (let i = -12; i <= 12; i += 8) cx.fillRect(x + i - 1, GY - 44, 3, 44);
            cx.fillStyle = '#ffd1d8'; cx.fillRect(x - 18, GY - 44, 36, 3);
        }
        txt(SP[s.type].label, x, GY + 20, 12, ac2);        // 押すボタンの表示
        if (!s.done && s.stage === 0) {                    // ジャスト帯を示す縮む光の輪
            const r = 20 + Math.max(0, d) / s.app * 54;
            ring(x, GY - 20, r, Math.abs(d) <= s.pw, ac2);
        }
    }
    function drawCat(now) {
        let off = 0, brot = 0, rot = 0, arms = 0, bob = Math.sin(now / 110) * (1.5 + combo * 1.2);
        const amp = 1 + Math.min(combo, 4) * 0.12;
        if (now < stunUntil) {                             // 転倒（後ろへ倒れる）
            const k = (stunUntil - now) / 500;
            rot = -Math.min(1, (1 - k) * 4) * 1.3; brot = 0.5 * (1 - k); bob = 0;
        } else if (trick) {
            const tr = trick; bob = 0; arms = 1;
            if (tr.type === 3) {                           // 二段ジャンプ
                if (tr.t2 === null) {
                    const t = Math.min(1, (now - tr.start) / 220);
                    off = 58 * (1 - (1 - t) * (1 - t)); brot = -0.2;
                } else {
                    const u = (now - tr.t2) / 520;
                    if (u >= 1) { trick = null; arms = 0; }
                    else { off = 58 * (1 - u) + 70 * Math.sin(Math.PI * u); brot = Math.PI * 2 * u; }
                }
            } else {
                const t = (now - tr.start) / 450;
                if (t >= 1) { trick = null; arms = 0; }
                else {
                    const sn = Math.sin(Math.PI * t);
                    off = sn * [60, 26, 70][tr.type] * amp;
                    if (tr.type === 0) brot = -0.35 * sn;
                    if (tr.type === 1) brot = 0.25 * sn;
                    if (tr.type === 2) brot = Math.PI * 2 * t;
                }
            }
        }
        lastCatY = GY - off;
        cx.save(); cx.translate(CATX, GY - off + bob);
        // スケボー
        cx.save(); cx.translate(0, -9); cx.rotate(brot);
        cx.fillStyle = '#ff3d9a'; cx.fillRect(-28, -3, 56, 5);
        cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(-17, 3, 4, 0, 7); cx.arc(17, 3, 4, 0, 7); cx.fill();
        cx.restore();

        // 2頭身・灰色・サングラス着用・ストリートパーカーの猫
        cx.save(); cx.translate(0, -12); cx.rotate(rot);
        const w = Math.sin(now / 90);
        cx.lineCap = 'round';

        // しっぽ（灰色）
        cx.strokeStyle = '#8a909d'; cx.lineWidth = 5;
        cx.beginPath(); cx.moveTo(-8, -18); cx.quadraticCurveTo(-26, -14 + w * (4 + combo * 2), -22, -32 + w * (3 + combo * 2)); cx.stroke();

        // 足（スニーカー）
        cx.strokeStyle = '#70757d'; cx.lineWidth = 5;
        cx.beginPath(); cx.moveTo(-5, -12); cx.lineTo(-6, -2); cx.moveTo(5, -12); cx.lineTo(6, -2); cx.stroke();
        cx.fillStyle = '#fff';
        cx.beginPath(); cx.ellipse(-6, -1, 6, 3, 0, 0, 7); cx.ellipse(6, -1, 6, 3, 0, 0, 7); cx.fill();

        // ストリートパーカー（胴体部分・鮮やかなストリートカラー）
        cx.fillStyle = '#ff6b35'; 
        cx.beginPath(); cx.roundRect(-12, -30, 24, 18, 5); cx.fill();
        // ポケット
        cx.fillStyle = '#d8521d';
        cx.beginPath(); cx.roundRect(-8, -18, 16, 9, 3); cx.fill();
        // パーカーの紐
        cx.strokeStyle = '#ffffff'; cx.lineWidth = 1.5;
        cx.beginPath(); cx.moveTo(-3, -26); cx.lineTo(-3, -20); cx.moveTo(3, -26); cx.lineTo(3, -20); cx.stroke();

        // 腕
        cx.strokeStyle = '#ff6b35'; cx.lineWidth = 5;
        cx.beginPath();
        if (arms) { cx.moveTo(-10, -25); cx.lineTo(-22, -45); cx.moveTo(10, -25); cx.lineTo(22, -45); }
        else { cx.moveTo(-10, -25); cx.lineTo(-18, -16 + w * 3); cx.moveTo(10, -25); cx.lineTo(18, -16 - w * 3); }
        cx.stroke();

        // 頭（2頭身で大きめの灰色 #8a909d）
        cx.fillStyle = '#8a909d'; cx.beginPath(); cx.arc(0, -46, 17, 0, 7); cx.fill();
        
        // 三角耳（灰色、内側ピンク）
        cx.beginPath(); cx.moveTo(-15, -56); cx.lineTo(-6, -61); cx.lineTo(-11, -71); cx.fill();
        cx.beginPath(); cx.moveTo(15, -56); cx.lineTo(6, -61); cx.lineTo(11, -71); cx.fill();
        cx.fillStyle = '#ffb6c1';
        cx.beginPath(); cx.moveTo(-13, -57); cx.lineTo(-7, -60); cx.lineTo(-10, -68); cx.fill();
        cx.beginPath(); cx.moveTo(13, -57); cx.lineTo(7, -60); cx.lineTo(10, -68); cx.fill();

        // サングラス（必須）
        cx.fillStyle = '#111'; 
        cx.fillRect(-14, -53, 12, 8); cx.fillRect(2, -53, 12, 8); 
        cx.fillRect(-2, -51, 4, 3); // ブリッジ
        // グラサンのハイライト
        cx.fillStyle = 'rgba(255,255,255,0.7)'; 
        cx.fillRect(-12, -52, 3, 2); cx.fillRect(4, -52, 3, 2);

        // 鼻
        cx.fillStyle = '#d08c62'; cx.beginPath(); cx.arc(0, -41, 2.5, 0, 7); cx.fill();

        cx.restore(); cx.restore();
    }
    function draw(now) {
        // 夕焼け空

            txt('STAGE ' + (curLv + 1), W / 2, 46, 11, '#fff', 'center', '#2b1055');
            if (timeLeft <= 5 && Math.floor(now / 250) % 2 === 0) {   // ラストスパート点滅

        }
        if (state === 'title') {
            cx.fillStyle = 'rgba(10,0,30,0.55)'; cx.fillRect(0, 0, W, H);
            txt('ニャン・ニャン・スケボー', W / 2, 90, 25, '#ffe14d', 'center', '#2b1055');
            /* txt('トリックタイム', W / 2, 132, 30, '#ff3d9a', 'center', '#fff'); */

            txt('JUMP', W / 2 - 80, 198, 14, ACT[0].c, 'center', '#2b1055');
            txt('GRIND', W / 2, 198, 14, ACT[1].c, 'center', '#2b1055');
            txt('FLIP', W / 2 + 80, 198, 14, ACT[2].c, 'center', '#2b1055');
            txt('赤い壁は JUMP を空中でもう1回！', W / 2, 222, 12, '#fff');
            if (Math.floor(now / 500) % 2 === 0) txt('TAP / SPACE でスタート', W / 2, 262, 16, '#7df9ff', 'center', '#2b1055');

        } else if (state === 'result') {

            if (newRecord) txt('NEW BEST!', W / 2, 262, 18, '#ffe14d');
            const nx = TH.find(t => t[0] > score);
            txt(nx ? 'あと' + (nx[0] - score) + '点で' + nx[1] + 'ランクアップ！' : '最高ランク達成！', W / 2, 288, 14, '#fff');
            txt('MAX COMBO ' + maxCombo + ' / PERFECT ' + perfects + ' / MISS ' + misses, W / 2, 316, 11, '#bbb');
        }
    }
    function loop(now) {
        const dt = Math.min(50, now - (lastT || now)); lastT = now;
        update(now, dt); draw(now);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    </script>
</body>
</html>
